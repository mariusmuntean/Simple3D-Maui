<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scene viewer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FF8A3D;text-decoration:none}a:hover{color:#FFC08F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: radial-gradient(90% 45% at 50% 42%, #3A1A08 0%, #140C07 60%); color: #F7F1EC; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden">

  <img src="../assets/gantry-crane.jpg" alt="Gantry Crane scene with the moving bridge selected" style="position: absolute; left: -45px; top: 170px; width: 480px; height: 360px; mix-blend-mode: lighten">
  <div style="position: absolute; left: 138px; top: 238px; width: 106px; height: 60px; border-radius: 10px; border: 2px dashed #FF8A3D; box-shadow: 0 0 18px rgba(255,138,61,.55)"></div>

  <div style="position: absolute; left: 16px; right: 16px; top: 54px; display: flex; align-items: center; gap: 10px">
    <a href="Main.dc.html" aria-label="Back to scenes" style="width: 44px; height: 44px; flex: none; border-radius: 22px; background: rgba(21,18,16,.85); border: 1px solid #2E2723; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F7F1EC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
    </a>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center">
      <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 18px">Gantry Crane</span>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #FF8A3D">05 · Linked motion</span>
    </div>
    <a href="Renderer.dc.html" aria-label="Renderer: Auto, drawing on the GPU" style="height: 44px; padding: 0 12px; flex: none; border-radius: 22px; background: rgba(21,18,16,.85); border: 1px solid #2E2723; display: flex; align-items: center; gap: 6px; color: #F7F1EC; font-size: 13px; font-weight: 500">
      <span style="width: 8px; height: 8px; border-radius: 4px; background: #FF8A3D; box-shadow: 0 0 10px #FF8A3D"></span>GPU
    </a>
  </div>

  <a href="Surface.dc.html" aria-label="Frame stats: idle. Show details" style="position: absolute; left: 16px; top: 118px; height: 44px; padding: 0 14px; border-radius: 22px; background: rgba(21,18,16,.85); border: 1px solid #2E2723; display: flex; align-items: center; gap: 6px; color: #D6CBC2; font-family: 'JetBrains Mono', monospace; font-size: 12px">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A89C93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"></path></svg>idle
  </a>

  <div role="toolbar" aria-label="Camera" style="position: absolute; right: 16px; top: 118px; display: flex; flex-direction: column; gap: 4px; padding: 4px; border-radius: 26px; background: rgba(21,18,16,.85); border: 1px solid #2E2723">
    <button type="button" aria-label="Zoom in" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F7F1EC" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
    <button type="button" aria-label="Zoom out" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F7F1EC" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
    <div style="height: 1px; margin: 2px 8px; background: #2E2723"></div>
    <button type="button" aria-label="Fit scene to view" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F7F1EC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg></button>
    <button type="button" aria-label="Reset scene" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F7F1EC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg></button>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 34px; display: flex; flex-direction: column; gap: 10px">
    <div style="align-self: flex-start; display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 2px 0 16px; border-radius: 24px; background: #3A1C0A; border: 1px solid #FF8A3D">
      <span style="font-size: 12px; color: #FFC08F; font-weight: 600">Selected</span>
      <span style="font-size: 14px; font-weight: 600">Moving bridge</span>
      <button type="button" aria-label="Clear selection" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#F7F1EC" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
    </div>
    <div style="padding: 16px; border-radius: 24px; background: rgba(21,18,16,.92); border: 1px solid #2E2723; display: flex; align-items: center; gap: 14px">
      <p style="margin: 0; flex: 1; font-size: 14px; line-height: 1.45; color: #D6CBC2">A moving carriage and hoist share a transform while the gantry stays fixed.</p>
      <button type="button" style="height: 52px; padding: 0 20px; flex: none; border-radius: 26px; border: 0; background: linear-gradient(180deg, #FFA45E 0%, #FF7A2A 100%); box-shadow: 0 0 24px rgba(255,138,61,.45); color: #2B1203; font: 600 15px Inter, sans-serif; display: flex; align-items: center; gap: 8px; cursor: pointer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#2B1203" aria-hidden="true"><path d="M7 5v14l12-7z"></path></svg>Animate
      </button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
