<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Renderer sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FF8A3D;text-decoration:none}a:hover{color:#FFC08F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: radial-gradient(90% 45% at 50% 42%, #3A1A08 0%, #140C07 60%); color: #F7F1EC; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden">
  <img src="../assets/gantry-crane.jpg" alt="" style="position: absolute; left: -45px; top: 170px; width: 480px; height: 360px; mix-blend-mode: lighten">
  <a href="Viewer.dc.html" aria-label="Close renderer sheet" style="position: absolute; inset: 0; background: rgba(5,4,3,.72)"></a>

  <div role="dialog" aria-labelledby="renderer-title" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 20px 34px; border-radius: 28px 28px 0 0; background: #151210; border-top: 1px solid #2E2723; display: flex; flex-direction: column; gap: 16px">
    <div style="width: 36px; height: 5px; border-radius: 3px; background: #3D3530; align-self: center"></div>
    <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h2 id="renderer-title" style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 22px">Renderer</h2>
        <p style="margin: 0; font-size: 14px; color: #A89C93; line-height: 1.4">How scenes are drawn. Picking a mode again retries the GPU.</p>
      </div>
      <a href="Viewer.dc.html" aria-label="Close" style="width: 44px; height: 44px; flex: none; border-radius: 22px; background: #1E1A17; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F7F1EC" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
      </a>
    </div>

    <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Rendering mode</legend>
      <label style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px; background: #1E1A17; border: 1.5px solid #FF8A3D; box-shadow: 0 0 24px rgba(255,138,61,.25); cursor: pointer">
        <span style="width: 40px; height: 40px; flex: none; border-radius: 12px; background: #3A1C0A; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FF8A3D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"></path></svg></span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-weight: 600; font-size: 16px">Auto <span style="font-size: 12px; font-weight: 500; color: #FF8A3D; margin-left: 6px">Default</span></span>
          <span style="font-size: 13px; color: #A89C93; line-height: 1.35">GPU when it works, software when it doesn't.</span>
        </span>
        <input type="radio" name="mode" value="Auto" checked style="width: 20px; height: 20px; accent-color: #FF8A3D; margin: 0">
      </label>
      <label style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px; background: #1E1A17; border: 1.5px solid #2E2723; cursor: pointer">
        <span style="width: 40px; height: 40px; flex: none; border-radius: 12px; background: #26201C; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F7F1EC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="3"></rect><rect x="9" y="9" width="6" height="6"></rect><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"></path></svg></span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-weight: 600; font-size: 16px">Hardware</span>
          <span style="font-size: 13px; color: #A89C93; line-height: 1.35">GPU only: Metal or OpenGL ES. Blank if the GPU fails.</span>
        </span>
        <input type="radio" name="mode" value="Hardware" style="width: 20px; height: 20px; accent-color: #FF8A3D; margin: 0">
      </label>
      <label style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px; background: #1E1A17; border: 1.5px solid #2E2723; cursor: pointer">
        <span style="width: 40px; height: 40px; flex: none; border-radius: 12px; background: #26201C; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F7F1EC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path></svg></span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-weight: 600; font-size: 16px">Software</span>
          <span style="font-size: 13px; color: #A89C93; line-height: 1.35">Drawn on the CPU with SkiaSharp. Works everywhere.</span>
        </span>
        <input type="radio" name="mode" value="Software" style="width: 20px; height: 20px; accent-color: #FF8A3D; margin: 0">
      </label>
    </fieldset>

    <div style="padding: 14px 16px; border-radius: 16px; background: #0A0908; border: 1px solid #2E2723; display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; color: #A89C93; text-transform: uppercase; letter-spacing: .08em; font-weight: 600">Drawing now</span>
      <div style="display: flex; align-items: center; gap: 8px">
        <span style="width: 8px; height: 8px; border-radius: 4px; background: #FF8A3D; box-shadow: 0 0 10px #FF8A3D"></span>
        <span style="font-weight: 600; font-size: 15px">Hardware</span>
      </div>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #D6CBC2; line-height: 1.5">Metal / [device name]</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
