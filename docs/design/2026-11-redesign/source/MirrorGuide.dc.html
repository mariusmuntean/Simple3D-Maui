<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mirror: finding you</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FF8A3D;text-decoration:none}a:hover{color:#FFC08F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(180deg, #2A2724 0%, #1A1816 55%, #24201D 100%); color: #F7F1EC; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden">

  <span style="position: absolute; left: 0; right: 0; top: 400px; text-align: center; font-size: 12px; color: #A89C93; letter-spacing: .08em; text-transform: uppercase">Camera preview</span>

  <svg viewBox="0 0 100 200" width="210" height="420" style="position: absolute; left: 90px; top: 196px; filter: drop-shadow(0 0 10px rgba(255,138,61,.55))" role="img" aria-label="Outline showing how to stand in the frame">
    <path d="M50,4 A13,13 0 1 1 49.9,4 Z M30,36 L70,36 Q80,36 82,46 L90,100 Q91,106 85,107 Q80,107 79,101 L72,60 L72,112 L68,190 Q67,196 61,196 Q55,196 55,190 L52,124 L48,124 L45,190 Q45,196 39,196 Q33,196 32,190 L28,112 L28,60 L21,101 Q20,107 15,107 Q9,106 10,100 L18,46 Q20,36 30,36 Z" fill="rgba(255,138,61,.08)" stroke="#FF8A3D" stroke-width="1.2" stroke-dasharray="3 2.5"></path>
  </svg>

  <div style="position: absolute; left: 16px; right: 16px; top: 54px; display: flex; justify-content: space-between">
    <a href="MirrorIntro.dc.html" aria-label="Close Mirror" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(10,9,8,.7); border: 1px solid rgba(255,255,255,.12); display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F7F1EC" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
    </a>
    <button type="button" aria-label="Switch between the front and back camera" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(10,9,8,.7); border: 1px solid rgba(255,255,255,.12); display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F7F1EC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7h-9a5 5 0 0 0 0 10h1M17 4l3 3-3 3M4 17h9a5 5 0 0 0 0-10h-1M7 20l-3-3 3-3"></path></svg>
    </button>
  </div>

  <div role="status" style="position: absolute; left: 24px; right: 24px; top: 116px; padding: 12px 16px; border-radius: 18px; background: rgba(10,9,8,.8); border: 1px solid rgba(255,138,61,.35); display: flex; gap: 10px; align-items: center">
    <span style="width: 10px; height: 10px; flex: none; border-radius: 5px; background: #FF8A3D; box-shadow: 0 0 10px #FF8A3D"></span>
    <span style="font-size: 14px; line-height: 1.4">Get into the frame: whole body, waist up, or just your head for face tracking</span>
  </div>

  <div role="radiogroup" aria-label="Character" style="position: absolute; left: 0; right: 0; bottom: 34px; display: flex; justify-content: center; gap: 12px">
    <button type="button" role="radio" aria-checked="true" aria-label="Chubby Tubby Cat" style="padding: 0; width: 64px; height: 64px; border-radius: 20px; border: 2px solid #FF8A3D; box-shadow: 0 0 18px rgba(255,138,61,.5); background: #151210; overflow: hidden; transform: scale(1.08); cursor: pointer"><img src="../assets/avatar-cat.png" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block"></button>
    <button type="button" role="radio" aria-checked="false" aria-label="Juanita" style="padding: 0; width: 64px; height: 64px; border-radius: 20px; border: 2px solid rgba(255,255,255,.18); background: #151210; overflow: hidden; cursor: pointer"><img src="../assets/avatar-juanita.png" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block"></button>
    <button type="button" role="radio" aria-checked="false" aria-label="CosmicBot" style="padding: 0; width: 64px; height: 64px; border-radius: 20px; border: 2px solid rgba(255,255,255,.18); background: #151210; overflow: hidden; cursor: pointer"><img src="../assets/avatar-cosmicbot.png" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block"></button>
    <button type="button" role="radio" aria-checked="false" aria-label="Froggy" style="padding: 0; width: 64px; height: 64px; border-radius: 20px; border: 2px solid rgba(255,255,255,.18); background: #151210; overflow: hidden; cursor: pointer"><img src="../assets/avatar-froggy.png" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block"></button>
  </div>
</div>
</x-dc>

}
</script>

</html>
