<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mirror live, landscape</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FF8A3D;text-decoration:none}a:hover{color:#FFC08F}
</style>
</helmet>
<div style="width: 844px; height: 390px; box-sizing: border-box; background: radial-gradient(45% 70% at 50% 55%, #4A220A 0%, #1A0D06 55%, #0A0908 100%); color: #F7F1EC; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden">

  <div style="position: absolute; left: 292px; top: 300px; width: 260px; height: 50px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,138,61,.55), rgba(255,138,61,0))"></div>
  <div style="position: absolute; left: 352px; top: 40px; width: 140px; height: 280px; border-radius: 70px 70px 30px 30px; border: 1.5px dashed rgba(255,192,143,.45); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px">
    <img src="../assets/avatar-juanita.png" alt="" style="width: 100px; height: 100px; border-radius: 32px; object-fit: cover; box-shadow: 0 0 34px rgba(255,138,61,.45)">
    <span style="font-size: 11px; color: #FFC08F; letter-spacing: .08em; text-transform: uppercase">Live 3D character</span>
  </div>

  <div role="radiogroup" aria-label="Character" style="position: absolute; left: 22px; top: 76px; display: flex; flex-direction: column; gap: 10px">
    <button type="button" role="radio" aria-checked="false" aria-label="Chubby Tubby Cat" style="padding: 0; width: 52px; height: 52px; border-radius: 16px; border: 2px solid rgba(255,255,255,.18); background: #151210; overflow: hidden; cursor: pointer"><img src="../assets/avatar-cat.png" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block"></button>
    <button type="button" role="radio" aria-checked="true" aria-label="Juanita" style="padding: 0; width: 52px; height: 52px; border-radius: 16px; border: 2px solid #FF8A3D; box-shadow: 0 0 16px rgba(255,138,61,.5); background: #151210; overflow: hidden; transform: scale(1.08); cursor: pointer"><img src="../assets/avatar-juanita.png" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block"></button>
    <button type="button" role="radio" aria-checked="false" aria-label="CosmicBot" style="padding: 0; width: 52px; height: 52px; border-radius: 16px; border: 2px solid rgba(255,255,255,.18); background: #151210; overflow: hidden; cursor: pointer"><img src="../assets/avatar-cosmicbot.png" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block"></button>
    <button type="button" role="radio" aria-checked="false" aria-label="Froggy" style="padding: 0; width: 52px; height: 52px; border-radius: 16px; border: 2px solid rgba(255,255,255,.18); background: #151210; overflow: hidden; cursor: pointer"><img src="../assets/avatar-froggy.png" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block"></button>
  </div>

  <div style="position: absolute; left: 22px; top: 18px; display: flex; gap: 8px">
    <a href="MirrorIntro.dc.html" aria-label="Close Mirror" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(10,9,8,.7); border: 1px solid rgba(255,255,255,.12); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F7F1EC" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
  </div>

  <div style="position: absolute; right: 22px; top: 18px; display: flex; gap: 10px; align-items: flex-start">
    <button type="button" aria-label="Switch between the front and back camera" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(10,9,8,.7); border: 1px solid rgba(255,255,255,.12); display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F7F1EC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7h-9a5 5 0 0 0 0 10h1M17 4l3 3-3 3M4 17h9a5 5 0 0 0 0-10h-1M7 20l-3-3 3-3"></path></svg></button>
    <div aria-label="Camera preview" style="width: 192px; height: 108px; border-radius: 16px; background: linear-gradient(180deg, #2A2724, #1A1816); border: 2px solid rgba(255,192,143,.5); box-shadow: 0 0 18px rgba(255,138,61,.25); display: flex; align-items: flex-end; padding: 8px; box-sizing: border-box"><span style="display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600"><span style="width: 6px; height: 6px; border-radius: 3px; background: #FF8A3D; box-shadow: 0 0 6px #FF8A3D"></span>Tracking</span></div>
  </div>

  <div style="position: absolute; right: 22px; bottom: 18px; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; padding: 10px 16px; border-radius: 16px; background: rgba(10,9,8,.75); border: 1px solid #2E2723">
    <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 15px">Juanita</span>
    <span style="font-size: 12px; color: #A89C93">Mouth, each eye, smile, frown, head</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
