<svg xmlns="http://www.w3.org/2000/svg" width="920" height="330" viewBox="0 0 920 330" role="img" aria-labelledby="title desc"><title id="title">Simple3D package boundaries</title><desc id="desc">An application supplies scene and camera data to portable Core. The MAUI SceneView calls Core and presents pixels through SkiaSharp on Android, iOS and Mac Catalyst. Core can also supply headless exports.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#526580"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#172841}.title{font-size:20px;font-weight:650}.detail{font-size:15px;fill:#42536b}.line{fill:none;stroke:#526580;stroke-width:2;marker-end:url(#arrow)}</style><rect width="920" height="330" rx="16" fill="#f4f7fc"/>
