name: Publish verified NuGet preview
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nuget-preview-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v0.2.0-preview.1
    steps:
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.401
      - name: Download validated release artifacts
        run: |
          mkdir packages
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir packages --pattern '*.nupkg' --pattern '*.snupkg'
      - name: Verify immutable preview artifacts
        working-directory: packages
        run: |
          sha256sum --strict --check <<'CHECKSUMS'
          15c9d396a1e28e4d3ba63eeb3dfb5da659475de754c26d29739534360910440b  Simple3D.Core.0.2.0-preview.1.nupkg
          049b139750ff306d89034b1fd8418ef319593f566ed4f1bc332a70fd59f521f9  Simple3D.Core.0.2.0-preview.1.snupkg
          be0d067aa9fff7699fd79bd262b7d50618852a9eb8156659ea097c79f0efcb6a  Simple3D.Maui.0.2.0-preview.1.nupkg
          63d96ffd80459a7cb5814a14876b96be24ad47d80833d1cdf603f3658a3cdc55  Simple3D.Maui.0.2.0-preview.1.snupkg
          CHECKSUMS
      - name: Authenticate with NuGet trusted publishing
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: marius.muntean
      - name: Publish Core and matching symbols
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push packages/Simple3D.Core.0.2.0-preview.1.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate --no-symbols
          dotnet nuget push packages/Simple3D.Core.0.2.0-preview.1.snupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Publish MAUI and matching symbols
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push packages/Simple3D.Maui.0.2.0-preview.1.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate --no-symbols
          dotnet nuget push packages/Simple3D.Maui.0.2.0-preview.1.snupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
