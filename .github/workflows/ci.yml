name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet run --project tests/Simple3D.Core.Tests --configuration Release
      - run: dotnet build src/Simple3D.Core --configuration Release --no-restore
      - run: dotnet pack src/Simple3D.Core --configuration Release --no-build --output artifacts/packages
  platforms:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - tfm: net10.0-ios
            rid: iossimulator-arm64
          - tfm: net10.0-maccatalyst
            rid: maccatalyst-arm64
          - tfm: net10.0-android
            rid: android-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: android-actions/setup-android@v4
        if: matrix.tfm == 'net10.0-android'
      - run: dotnet workload install maui
      - run: dotnet build samples/Simple3D.Demo/Simple3D.Demo.csproj -f ${{ matrix.tfm }} -r ${{ matrix.rid }} -c Release -p:EnableCodeSigning=false
      - name: Pack multi-target MAUI library
        if: matrix.tfm == 'net10.0-maccatalyst'
        run: dotnet pack src/Simple3D.Maui/Simple3D.Maui.csproj -c Release -p:EnableCodeSigning=false -o artifacts/packages
      - name: Build signed iOS simulator gallery
        if: matrix.tfm == 'net10.0-ios'
        run: dotnet build samples/Simple3D.Demo/Simple3D.Demo.csproj -f net10.0-ios -r iossimulator-arm64 -c Debug -p:EnableCodeSigning=true -p:CodesignKey=-
      - name: Launch gallery in iOS Simulator
        if: matrix.tfm == 'net10.0-ios'
        run: bash scripts/ios-simulator-smoke.sh
      - name: Save iOS screenshot
        if: always() && matrix.tfm == 'net10.0-ios'
        uses: actions/upload-artifact@v4
        with:
          name: ios-gallery-screenshot
          path: artifacts/ios-gallery-*.png
          if-no-files-found: warn
