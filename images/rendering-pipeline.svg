<svg xmlns="http://www.w3.org/2000/svg" width="920" height="490" viewBox="0 0 920 490" role="img" aria-labelledby="title desc"><title id="title">One render and presentation pipeline</title><desc id="desc">Scene changes lead to flattening, world transforms and shading, near-plane clipping and projection, then a depth test writes color and shape IDs. SceneView presents pixels and adds selection and labels; picking queries those same IDs.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#526580"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#172841}.title{font-size:20px;font-weight:650}.detail{font-size:15px;fill:#42536b}.line{fill:none;stroke:#526580;stroke-width:2;marker-end:url(#arrow)}</style><rect width="920" height="490" rx="16" fill="#f4f7fc"/><rect x="28" y="30" width="260" height="114" rx="12" fill="#dce6ff"/><text x="46" y="65" class="title">1 · Change and invalidate</text><text x="46" y="102" class="detail">Scene / camera → dirty frame</text><rect x="330" y="30" width="260" height="114" rx="12" fill="#dce6ff"/><text x="348" y="65" class="title">2 · Flatten and validate</text><text x="348" y="102" class="detail">Groups → leaves + transforms</text><rect x="632" y="30" width="260" height="114" rx="12" fill="#dce6ff"/><text x="650" y="65" class="title">3 · Transform and shade</text><text x="650" y="102" class="detail">World vertices + face colors</text><rect x="632" y="195" width="260" height="114" rx="12" fill="#dce6ff"/><text x="650" y="230" class="title">4 · Clip and project</text><text x="650" y="267" class="detail">Near plane → screen triangles</text><rect x="330" y="195" width="260" height="114" rx="12" fill="#dce6ff"/><text x="348" y="230" class="title">5 · Depth rasterize</text><text x="348" y="267" class="detail">Nearest pixel: color + leaf ID</text><rect x="28" y="195" width="260" height="114" rx="12" fill="#d9f0ea"/><text x="46" y="230" class="title">6 · Native presentation</text><text x="46" y="267" class="detail">Bitmap filter + tint + contour</text><path class="line" d="M288 87H330"/><path class="line" d="M590 87H632"/><path class="line" d="M762 144V195"/><path class="line" d="M632 252H590"/><path class="line" d="M330 252H288"/>
<rect x="28" y="371" width="260" height="88" rx="12" fill="#e8edf5"/><text x="48" y="403" class="title">Surface and labels</text><text x="48" y="435" class="detail">Scale bitmap; overlay text</text><path class="line" d="M158 309V371"/>
<rect x="330" y="371" width="260" height="88" rx="12" fill="#fff0db"/><text x="350" y="403" class="title">Pick visible leaf</text><text x="350" y="435" class="detail">Pointer → pixel → stored ID</text><path class="line" d="M460 309V371"/>
<text x="632" y="400" class="detail">Core owns depth scratch.</text><text x="632" y="428" class="detail">Target owns color and IDs.</text><text x="632" y="456" class="detail">Labels have no depth test.</text></svg>
